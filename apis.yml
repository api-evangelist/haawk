aid: haawk
name: HAAWK
description: HAAWK is a Los Angeles-based music rights management and monetization company that administers
  digital rights across YouTube, Facebook, Instagram, and TikTok for record labels, music publishers, and
  independent artists. Its products include HAAWK (full-service YouTube Content ID and Meta Rights Manager
  administration), Identifyy (self-service UGC rights management for independent creators), Keyframe Audio
  (a micro sync-licensing catalog of 50,000+ production music tracks), and Diistro (digital music distribution
  to Apple Music, Spotify, YouTube Music, and TikTok). HAAWK has administered 100B+ video views and manages
  1.1M+ music copyrights for 2,000+ rights holders. Backed by 500 Global. No public developer API, SDK, or
  documentation surface was found during enrichment.
